services:
  backend:
    build:
      context: ./backend
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      - PORT=8001
    volumes:
      - ./backend:/app
      - /app/.venv
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "3000:3000"
    env_file: .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
