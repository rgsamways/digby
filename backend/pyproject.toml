[project]
name = "digby-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "beanie==1.26.0",
    "motor>=3.7",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    "stripe>=10.0",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.20",
    "boto3>=1.35",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
